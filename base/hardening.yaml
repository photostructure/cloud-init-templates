#cloud-config
# System hardening

merge_how:
  - name: list
    settings: [append]
  - name: dict
    settings: [no_replace, recurse_list]

# System updates and package management
package_update: true
package_upgrade: true
packages:
  - unattended-upgrades
  - lynis
  - fail2ban
  - ufw
  - apt-transport-https
  - ca-certificates
  - apparmor-profiles
  - logrotate
  - auditd
  - psmisc
  - curl
  - jq

# Create deploy user with sudo access
users:
  - name: deploy
    gecos: "System Administrator"
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL:ALL) ALL"
    # SSH keys moved from root during setup

# SSH hardening configuration
ssh:
  emit_keys_to_console: false

# Disable root password login
chpasswd:
  expire: false

# Seed additional entropy from external sources
random_seed:
  command: ['/bin/bash', '-c', '(curl --max-time 10 --silent "https://beacon.nist.gov/beacon/2.0/pulse/last" | jq -r ".pulse.outputValue" | xxd -r -p 2>/dev/null || true) && (curl -m 10 -s "https://www.random.org/cgi-bin/randbyte?nbytes=64&format=h" | xxd -r -p 2>/dev/null || true)']
  command_required: false

write_files:
  # SSH hardening configuration
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      # Protocol settings
      Protocol 2

      # Host key configuration
      HostKey /etc/ssh/ssh_host_ed25519_key
      HostKey /etc/ssh/ssh_host_rsa_key
      RequiredRSASize 3072

      # Cryptographic settings
      RekeyLimit default 1h
      KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes256-ctr
      MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com

      # Logging
      SyslogFacility AUTH
      LogLevel VERBOSE

      # Authentication settings
      LoginGraceTime 30s
      PermitRootLogin no
      StrictModes yes
      MaxAuthTries 3
      MaxSessions 5
      PubkeyAuthentication yes
      AuthenticationMethods publickey

      # Password authentication (all disabled)
      PasswordAuthentication no
      PermitEmptyPasswords no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no

      # Other authentication methods (disabled)
      HostbasedAuthentication no
      KerberosAuthentication no
      GSSAPIAuthentication no

      # PAM integration
      UsePAM yes

      # Forwarding options (all disabled for security)
      AllowAgentForwarding no
      AllowTcpForwarding no
      X11Forwarding no

      # Connection settings
      PrintMotd no
      TCPKeepAlive yes
      ClientAliveInterval 300
      ClientAliveCountMax 2
      UseDNS no
      MaxStartups 3:50:10

      # User access control
      AllowUsers deploy
    permissions: "0644"
    owner: root:root

  # SSH port configuration (sourced from environment)
  - path: /usr/local/bin/configure-ssh-port.sh
    content: |
      #!/bin/bash
      # Move SSH to a non-default port safely.
      #
      # On Ubuntu 24.04 sshd is socket-activated, so the LISTENING port is set by
      # ssh.socket's ListenStream (not by sshd_config's Port). We set both, then
      # verify the new port is actually listening BEFORE removing port 22 - so a
      # failure can never lock us out.
      set -u

      # Load SSH_PORT from the infrastructure environment file.
      [ -f /etc/environment.d/90-infrastructure.conf ] && . /etc/environment.d/90-infrastructure.conf
      SSH_PORT="${SSH_PORT:-22}"

      if [ "$SSH_PORT" = "22" ]; then
          echo "SSH_PORT is 22 (default); leaving SSH on port 22."
          exit 0
      fi

      echo "Configuring SSH on port $SSH_PORT"

      # 1. Point the socket at the new port. NOTE: systemd does NOT expand shell
      #    variables in ListenStream, so we write the resolved number here.
      mkdir -p /etc/systemd/system/ssh.socket.d
      # One address-less ListenStream binds BOTH IPv4 and IPv6 (like the vendor
      # default 'ListenStream=22'). Do NOT list 0.0.0.0:P and [::]:P separately:
      # with bindv6only=0 the second bind collides (EADDRINUSE) and the whole
      # socket unit fails, leaving nothing listening - a guaranteed lockout.
      cat > /etc/systemd/system/ssh.socket.d/override.conf <<EOF
      [Socket]
      # Clear the inherited port-22 listener, then bind the custom port.
      ListenStream=
      ListenStream=${SSH_PORT}
      EOF

      # 2. Set Port in sshd_config too (used when sshd is not socket-activated).
      echo "Port ${SSH_PORT}" > /etc/ssh/sshd_config.d/99-custom-port.conf

      # 3. Open the new port in the firewall BEFORE we touch port 22.
      ufw allow "${SSH_PORT}"/tcp comment 'SSH custom port'

      # 4. Point fail2ban at the new port.
      mkdir -p /etc/fail2ban/jail.d
      cat > /etc/fail2ban/jail.d/sshd-custom-port.conf <<EOF
      [sshd]
      enabled = true
      port = ${SSH_PORT}
      EOF

      # 5. Apply the socket change and confirm the new port is actually listening.
      systemctl daemon-reload
      systemctl restart ssh.socket
      systemctl reload ssh.service 2>/dev/null || true

      listening=false
      for _ in 1 2 3 4 5; do
          if [ -n "$(ss -Htln "sport = :${SSH_PORT}" 2>/dev/null)" ]; then
              listening=true
              break
          fi
          sleep 1
      done

      if [ "$listening" = true ]; then
          # Safe to close port 22 now that the custom port works.
          echo "SSH is listening on ${SSH_PORT}; removing port 22 from the firewall."
          ufw delete allow 22/tcp 2>/dev/null || true
          echo "SSH configured on port ${SSH_PORT}."
      else
          # Never lock ourselves out: keep 22 open and flag the failure loudly.
          echo "ERROR: SSH is not listening on ${SSH_PORT}; leaving port 22 open for recovery." >&2
          echo "SSH port change to ${SSH_PORT} FAILED - port 22 left open. Inspect 'systemctl status ssh.socket'." \
              > /root/SSH-PORT-CHANGE-FAILED.txt
      fi
    permissions: "0755"
    owner: root:root

  # Basic kernel hardening
  - path: /etc/sysctl.d/99-security-hardening.conf
    content: |
      # Network security
      net.ipv4.ip_forward = 0
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv4.tcp_syncookies = 1
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      net.ipv4.icmp_ignore_bogus_error_responses = 1
      net.ipv4.conf.all.log_martians = 1
      net.ipv4.conf.default.log_martians = 1

      # Kernel security
      kernel.dmesg_restrict = 1
      kernel.kptr_restrict = 1
      kernel.randomize_va_space = 2

      # File system hardening
      fs.suid_dumpable = 0
      fs.protected_hardlinks = 1
      fs.protected_symlinks = 1
    permissions: "0644"
    owner: root:root

  # Unattended upgrades configuration
  - path: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
      Unattended-Upgrade::Automatic-Reboot-Time "02:00";
    permissions: "0644"
    owner: root:root

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    permissions: "0644"
    owner: root:root

# System hardening commands
runcmd:
  # Generate random password for deploy user and save to file. 28 hex characters is 112 bits "which is enough entropy for anyone" -billg
  - |
    DEPLOY_PASSWORD=$(openssl rand -hex 28)
    echo "deploy:$DEPLOY_PASSWORD" | chpasswd
    echo "$DEPLOY_PASSWORD" > /home/deploy/.initial_password
    chown deploy:deploy /home/deploy/.initial_password
    chmod 600 /home/deploy/.initial_password

  # Give the deploy user the SSH key the cloud provider installed for root.
  # Do NOT abort the run if it is missing (that skips all hardening below, which
  # is worse than continuing) - flag it loudly and fall back to the DO console.
  - mkdir -p /home/deploy/.ssh
  - |
    if [ -s /root/.ssh/authorized_keys ]; then
      mv /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
    elif [ ! -s /home/deploy/.ssh/authorized_keys ]; then
      echo "WARNING: no SSH key found for root or deploy - add one via the DigitalOcean console." \
        | tee /root/NO-SSH-KEY-FOUND.txt >&2
    fi
  - chown -R deploy:deploy /home/deploy/.ssh
  - chmod 700 /home/deploy/.ssh
  - chmod 600 /home/deploy/.ssh/authorized_keys 2>/dev/null || true

  # Disable unnecessary MOTD components
  - chmod -x /etc/update-motd.d/10-help-text 2>/dev/null || true
  - chmod -x /etc/update-motd.d/50-motd-news 2>/dev/null || true
  - chmod -x /etc/update-motd.d/91-contract-ua-esm-status 2>/dev/null || true

  # Apply kernel security settings
  - sysctl -p /etc/sysctl.d/99-security-hardening.conf

  # Basic file permissions hardening
  - chmod 700 /root
  - chmod 600 /etc/ssh/sshd_config
  - chmod +t /tmp /var/tmp

  # Secure shared memory
  - echo "tmpfs /run/shm tmpfs defaults,noexec,nosuid 0 0" >> /etc/fstab

  # Remove weak SSH host keys and regenerate strong ones
  - rm -f /etc/ssh/ssh_host_dsa_key /etc/ssh/ssh_host_dsa_key.pub
  - rm -f /etc/ssh/ssh_host_ecdsa_key /etc/ssh/ssh_host_ecdsa_key.pub

  # Ensure 4096-bit RSA key
  - |
    if [ -f /etc/ssh/ssh_host_rsa_key ]; then
      key_size=$(ssh-keygen -lf /etc/ssh/ssh_host_rsa_key | awk '{print $1}')
      if [ "$key_size" -lt 4096 ]; then
        rm -f /etc/ssh/ssh_host_rsa_key /etc/ssh/ssh_host_rsa_key.pub
        ssh-keygen -t rsa -b 4096 -f /etc/ssh/ssh_host_rsa_key -N "" -C "$(hostname)-$(date +%Y-%m-%d)"
      fi
    fi

  # Ensure Ed25519 host key exists
  - |
    if [ ! -f /etc/ssh/ssh_host_ed25519_key ]; then
      ssh-keygen -t ed25519 -f /etc/ssh/ssh_host_ed25519_key -N "" -C "$(hostname)-$(date +%Y-%m-%d)"
    fi

  # Configure firewall. Port 22 stays open as a bootstrap rule; the SSH-port
  # step below removes it only once the custom port is verified listening.
  - ufw --force reset
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH bootstrap'
  - ufw allow 80/tcp comment 'HTTP'
  - ufw allow 443/tcp comment 'HTTPS'
  - ufw --force enable

  # Validate sshd config, then enable services.
  - sshd -t
  - systemctl restart sshd
  - systemctl enable unattended-upgrades fail2ban auditd
  - systemctl start unattended-upgrades fail2ban auditd

  # Move SSH to its custom port LAST - after the firewall is up and sshd is
  # running - and only close port 22 once the new port is verified listening.
  - /usr/local/bin/configure-ssh-port.sh

# Reboot after hardening, but ONLY if SSH is reachable, so a botched SSH/firewall
# change leaves the box up and recoverable instead of rebooting into a lockout.
# (A failed runcmd does NOT stop a reboot; this condition does.)
power_state:
  mode: reboot
  message: "Rebooting after hardening setup"
  timeout: 60
  condition:
    - /bin/bash
    - -c
    - '. /etc/environment.d/90-infrastructure.conf 2>/dev/null; p="${SSH_PORT:-22}"; test -n "$(ss -Htln "sport = :$p")"'

final_message: "Base hardening complete. SSH reachable on the configured port. System ready after $UPTIME seconds."
