#cloud-config
# PostgreSQL database server setup - Ubuntu archive method

# WHY THE UBUNTU ARCHIVE AND NOT apt.postgresql.org (pgdg):
#
# Ubuntu 26.04 LTS ships PostgreSQL 18 in main (`postgresql` -> 18+290ubuntu1),
# which is the same major pgdg would install today, so pgdg buys no version.
# What pgdg buys is a major-version upgrade path independent of the distro --
# and that does not fit how these boxes work. A major upgrade here means
# provisioning a new server from this cloud-init and restoring the nightly
# pg_dump, not running pg_upgradecluster in place.
#
# It also costs something concrete: hardening.yaml's
# Unattended-Upgrade::Allowed-Origins lists only the distro and ESM pockets, so
# a pgdg-sourced PostgreSQL would silently stop receiving automatic security
# updates until that origin were added too.
#
# Revisit this if a PostgreSQL major newer than the distro's is ever needed
# before the next LTS, or if an extension is required that only pgdg packages.

merge_how:
  - name: list
    settings: [append]
  - name: dict
    settings: [no_replace, recurse_list]

packages:
  # `postgresql` is the metapackage; on 26.04 it pulls postgresql-18. Do not add
  # postgresql-contrib: on 26.04 it has no candidate of its own and exists only
  # as a virtual package that `postgresql` Provides. The contrib extensions are
  # in postgresql-18 itself.
  - postgresql

runcmd:
  # postgresql-common creates the `main` cluster on port 5432 at install time.
  - systemctl enable --now postgresql

final_message: "PostgreSQL installed from the Ubuntu archive"
